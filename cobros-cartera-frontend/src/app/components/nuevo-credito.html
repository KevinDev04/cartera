<div class="max-w-md mx-auto bg-slate-800 rounded-3xl p-6 border border-slate-700/60 shadow-2xl my-6 text-white font-sans">
  
  <div class="mb-6">
    <h2 class="text-xl font-bold text-emerald-400">🆕 Registrar Crédito Completo</h2>
    <p class="text-xs text-slate-400">Los campos calculados (cuotas, deudas e intereses) se procesarán automáticamente en el servidor.</p>
  </div>

    <form (ngSubmit)="guardarCredito()" class="space-y-4">
    
        <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Cédula de Identidad</label>
            <input type="text" name="cedula" [(ngModel)]="credito.cedula" (change)="verificarCedula()" required
            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Nombre Completo</label>
            <input type="text" name="nombre_completo" [(ngModel)]="credito.nombre_completo" [disabled]="clienteExiste" [required]="!clienteExiste"
            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 disabled:opacity-50 disabled:bg-slate-950 focus:outline-none focus:border-emerald-500">
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Teléfono</label>
            <input type="text" name="telefono" [(ngModel)]="credito.telefono" [disabled]="clienteExiste"
            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 disabled:opacity-50 disabled:bg-slate-950 focus:outline-none focus:border-emerald-500">
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Dirección de Residencia</label>
            <input type="text" name="direccion_residencia" [(ngModel)]="credito.direccion_residencia" [disabled]="clienteExiste"
            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 disabled:opacity-50 disabled:bg-slate-950 focus:outline-none focus:border-emerald-500">
        </div>

        <hr class="border-slate-800 my-4">

        <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Monto a Prestar ($)</label>
            <input type="number" name="capital_prestado" [(ngModel)]="credito.capital_prestado" required
            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Interés (%)</label>
            <input type="number" name="porcentaje_interes" [(ngModel)]="credito.porcentaje_interes" required
                class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
            </div>
            <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Duración (Meses)</label>
            <input type="number" name="meses_duracion" [(ngModel)]="credito.meses_duracion" required
                class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
            </div>
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Frecuencia de Pago</label>
            <select name="frecuencia_pago" [(ngModel)]="credito.frecuencia_pago" required
            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
            <option value="diario">Diario</option>
            <option value="semanal">Semanal</option>
            <option value="quincenal">Quincenal</option>
            <option value="mensual">Mensual</option>
            </select>
        </div>

        <button type="submit"
            class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-xl py-3.5 text-sm transition-colors mt-2 shadow-lg shadow-emerald-900/20">
            🚀 Guardar y Procesar Crédito
        </button>
    </form>
</div>
